# SAM deploy configuration
# Run `sam deploy --guided` on first deploy to customize these values.

version = 0.1

[default.deploy.parameters]
stack_name = "watermark-saas"
resolve_s3 = true
resolve_image_repos = true
s3_prefix = "watermark-saas"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []
